<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg-100: #fafbfc;
        --ink-100: #171718;
        --ink-900: #4e5159;
        --ink-700: #888d98;
        --accent: #0a72ef;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        width: 1920px; height: 1080px;
        background: var(--bg-100);
        overflow: hidden;
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        color: var(--ink-100);
      }
      [data-composition-id="cover"] {
        position: relative;
        width: 1920px; height: 1080px;
        overflow: hidden;
      }

      /* single-blue atmospheric wash — the only decorative system */
      .bg-mesh {
        position: absolute; inset: 0;
        background:
          radial-gradient(1000px 600px at 25% 30%, rgba(10,114,239,0.10), transparent 65%),
          radial-gradient(900px 700px at 80% 40%, rgba(10,114,239,0.06), transparent 60%);
      }
      .bg-grain {
        position: absolute; inset: 0;
        background-image:
          radial-gradient(circle at 25% 35%, rgba(0,0,0,0.035) 1px, transparent 1px),
          radial-gradient(circle at 75% 65%, rgba(0,0,0,0.025) 1px, transparent 1px);
        background-size: 4px 4px, 6px 6px;
      }

      /* brand lockup — top-left */
      .lockup {
        position: absolute; left: 64px; top: 64px;
        display: flex; align-items: center; gap: 20px;
      }
      .lockup-mark { width: 120px; height: 120px; }
      .lockup-word {
        font-size: 44px; font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink-100);
      }

      /* hero text */
      .hero {
        position: absolute;
        left: 160px; right: 160px;
        top: 50%; transform: translateY(-50%);
      }
      .hero-kicker {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink-700);
        margin-bottom: 32px;
      }
      .hero-title {
        font-size: 120px; font-weight: 700; line-height: 1.05;
        letter-spacing: -0.02em;
        text-wrap: balance;
        max-width: 1560px;
      }
      .hero-title .accent {
        color: var(--accent);
      }
      .hero-subtitle {
        margin-top: 40px;
        font-size: 40px; font-weight: 400; line-height: 1.4;
        color: var(--ink-900);
        max-width: 1280px;
      }

      /* bottom meta bar */
      .meta {
        position: absolute; left: 160px; right: 160px; bottom: 64px;
        display: flex; justify-content: space-between; align-items: center;
        padding-top: 28px;
        box-shadow: inset 0 1px 0 rgba(0,0,0,0.08);
      }
      .meta-brand {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 24px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink-700);
      }
      .meta-tag {
        font-size: 24px; color: var(--ink-900);
      }
    </style>
  </head>
  <body>
    <div
      id="cover-root"
      data-composition-id="cover"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="1.0"
    >
      <div class="bg-mesh"></div>
      <div class="bg-grain"></div>

      <div class="lockup">
        <img class="lockup-mark" src="{{LOGO}}" alt="" />
        <span class="lockup-word">{{BRAND}}</span>
      </div>

      <div class="hero">
        <div class="hero-kicker">{{KICKER}}</div>
        <h1 class="hero-title">{{TITLE}}</h1>
        <div class="hero-subtitle">{{SUBTITLE}}</div>
      </div>

      <div class="meta">
        <span class="meta-brand">{{BRAND}} · TECH</span>
        <span class="meta-tag">1920 × 1080</span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(".lockup", { y: -16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo(".hero-kicker", { y: -12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.fromTo(".hero-title", { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" }, 0.3);
      tl.fromTo(".hero-subtitle", { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 0.5);
      tl.fromTo(".meta", { y: 12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0.6);
      window.__timelines["cover"] = tl;
    </script>
  </body>
</html>
