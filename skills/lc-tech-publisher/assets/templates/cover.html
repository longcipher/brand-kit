<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      :root {
        --bg-900: #05070E;
        --bg-800: #0B0F19;
        --ink-100: #F4F6FB;
        --ink-200: #D6DDE9;
        --ink-300: #A8B2C2;
        --ink-400: #828C9D;
        --hairline: rgba(255, 255, 255, 0.08);
        --accent: #0a72ef;
        --accent-hair: rgba(10, 114, 239, 0.40);
        --gold: #FBBF24;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{WIDTH}}px; height: {{HEIGHT}}px; background: var(--bg-900);
        overflow: hidden;
        font-family: "Inter", "Noto Sans SC", system-ui, sans-serif;
        color: var(--ink-100);
        -webkit-font-smoothing: antialiased;
      }
      [data-composition-id] { position: relative; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; }

      /* subtle grid + corner vignette (no colored blobs) */
      #bg-grid { position: absolute; inset: 0; z-index: 0; opacity: 0.55; }
      #bg-vignette {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background:
          radial-gradient(ellipse 70% 60% at 50% 50%, transparent 60%, rgba(0,0,0,0.55) 100%),
          linear-gradient(180deg, rgba(255,255,255,0.02), transparent 30%);
      }

      .lockup {
        position: absolute; top: 5%; left: 6%;
        display: flex; align-items: center; gap: 14px; opacity: 0.55;
        z-index: 4;
      }
      .lockup img { width: 36px; height: 36px; }
      .lockup span {
        font-family: "JetBrains Mono", monospace;
        font-size: calc(20px * var(--scale)); font-weight: 700;
        color: var(--ink-200); letter-spacing: .14em;
      }
      .corner-tag {
        position: absolute; top: 5%; right: 6%;
        font-family: "JetBrains Mono", monospace;
        font-size: calc(18px * var(--scale)); letter-spacing: .14em;
        text-transform: uppercase; color: var(--accent);
        border: 1px solid var(--accent-hair); padding: 6px 10px;
        z-index: 4;
      }

      .center {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 88%; text-align: center; z-index: 3;
      }
      .kicker {
        font-family: "JetBrains Mono", monospace;
        font-size: calc(20px * var(--scale));
        letter-spacing: .18em; text-transform: uppercase; color: var(--accent);
        margin-bottom: calc(18px * var(--scale));
        display: flex; align-items: center; justify-content: center; gap: 14px;
      }
      .kicker::before, .kicker::after {
        content: ""; width: 28px; height: 1px; background: var(--accent);
      }
      .title {
        font-size: calc(64px * var(--scale)); font-weight: 800; line-height: 1.06;
        letter-spacing: -0.02em; color: var(--ink-100);
      }
      .title .accent { color: var(--accent); }
      .sub {
        margin-top: calc(18px * var(--scale)); font-size: calc(25px * var(--scale));
        font-weight: 400; color: var(--ink-200); line-height: 1.35;
      }
      /* 今日重点事件清单——提高封面信息量 */
      .headlines {
        margin: calc(26px * var(--scale)) auto 0; width: 92%;
        display: flex; flex-direction: column; gap: calc(7px * var(--scale));
        text-align: left;
        border-top: 1px solid var(--hairline);
        padding-top: calc(16px * var(--scale));
      }
      .headlines .hl-head {
        font-family: "JetBrains Mono", monospace;
        font-size: calc(14px * var(--scale)); letter-spacing: .14em;
        text-transform: uppercase; color: var(--ink-400);
        margin-bottom: calc(6px * var(--scale));
      }
      .headlines ul { list-style: none; display: flex; flex-direction: column; gap: calc(6px * var(--scale)); }
      .headlines li {
        display: flex; align-items: baseline; gap: calc(12px * var(--scale));
        font-size: calc(18px * var(--scale)); line-height: 1.32; color: var(--ink-200);
      }
      .headlines .hl-idx {
        flex: 0 0 auto; color: var(--accent); font-family: "JetBrains Mono", monospace;
        font-weight: 700; transform: translateY(1px);
      }
      .headlines .hl-txt b, .headlines .hl-txt strong { color: var(--ink-100); font-weight: 700; }

      .meta-row {
        position: absolute; bottom: 5%; left: 6%; right: 6%;
        display: flex; justify-content: space-between; align-items: baseline;
        z-index: 4;
      }
      .meta-row .left, .meta-row .right {
        font-family: "JetBrains Mono", monospace;
        font-size: calc(16px * var(--scale));
        color: var(--ink-300); letter-spacing: .12em; text-transform: uppercase;
      }
      .meta-row .center-bar {
        flex: 1; height: 1px; margin: 0 18px;
        background: linear-gradient(90deg, transparent, var(--accent-hair), transparent);
      }
    </style>
  </head>
  <body>
    <div
      id="cover-root"
      data-composition-id="cover"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
      data-start="0"
      data-duration="2.8"
    >
      <svg id="bg-grid" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1920 1080">
        <defs>
          <pattern id="grid-pat-cover" width="60" height="60" patternUnits="userSpaceOnUse">
            <path d="M60 0 H0 V60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#grid-pat-cover)"/>
      </svg>
      <div id="bg-vignette"></div>

      <div class="lockup">
        <img src="{{LOGO}}" alt="" />
        <span>LongCipher</span>
      </div>
      <div class="corner-tag">{{CORNER_TAG}}</div>

      <div class="center">
        <div class="kicker">{{KICKER}}</div>
        <div class="title">{{TITLE}}</div>
        <div class="sub">{{SUBTITLE}}</div>
        <div class="headlines">
          <div class="hl-head">{{HEADLINES_LABEL}}</div>
          <ul>
{{HEADLINES}}
          </ul>
        </div>
      </div>

      <div class="meta-row">
        <span class="left">{{META_LEFT}}</span>
        <span class="center-bar"></span>
        <span class="right">{{META_RIGHT}}</span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(".kicker", { y: -12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.fromTo(".title", { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.8, ease: "power3.out" }, 0.3);
      tl.fromTo(".sub", { y: 18, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 0.6);
      tl.fromTo(".headlines", { y: 22, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 0.85);
      tl.fromTo(".headlines li", { x: -16, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, stagger: 0.12, ease: "power2.out" }, 0.95);
      tl.fromTo(".lockup", { x: -16, autoAlpha: 0 }, { x: 0, autoAlpha: 0.55, duration: 0.5 }, 0.1);
      tl.fromTo(".corner-tag", { x: 16, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5 }, 0.1);
      tl.fromTo(".meta-row", { y: 14, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5 }, 0.75);
      window.__timelines["cover"] = tl;
    </script>
  </body>
</html>
