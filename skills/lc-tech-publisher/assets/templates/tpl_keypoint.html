<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keypoint-{{IDX}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #fafbfc; --surface: #ffffff; --ink: #171718;
        --ink-200: #4e5159; --ink-300: #6b6e75; --ink-400: #888d98;
        --line: #e0e2e8; --line-strong: #b4b8c2;
        --accent: #0a72ef; --accent-soft: rgba(10,114,239,0.10); --accent-hair: rgba(10,114,239,0.40);
        --shadow-rest: rgba(23,23,23,0.06) 0 0 0 1px, rgba(23,23,23,0.04) 0 1px 2px, #ffffff 0 0 0 1px inset;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{WIDTH}}px; height: {{HEIGHT}}px; background: var(--canvas);
        overflow: hidden; font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      [data-composition-id] { position: relative; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; }

      #bg-grid { position: absolute; inset: 0; z-index: 0; }
      /* one accent vertical rule on the left — the only color on the slide */
      .accent-rule {
        position: absolute; left: 8%; top: 22%; width: 3px; height: 56%;
        background: var(--accent); z-index: 1;
      }

      .stage {
        position: absolute; inset: 0; z-index: 3;
        display: flex; flex-direction: column; justify-content: center;
        padding: 0 14%;
      }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: calc(20px * var(--scale)); letter-spacing: .18em;
        text-transform: uppercase; color: var(--accent);
        margin-bottom: calc(28px * var(--scale));
        display: flex; align-items: center; gap: 14px;
      }
      .eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--accent); }
      .statement {
        font-size: calc(60px * var(--scale)); font-weight: 700; line-height: 1.22;
        letter-spacing: -0.02em; color: var(--ink); max-width: 1500px;
      }
      .statement .hl { color: var(--accent); }
      .support {
        margin-top: calc(30px * var(--scale)); font-size: calc(26px * var(--scale));
        font-weight: 400; color: var(--ink-300); line-height: 1.45; max-width: 1200px;
        font-family: "JetBrains Mono", monospace; letter-spacing: .02em;
      }

      .idx-tag {
        position: absolute; right: 8%; bottom: 10%; z-index: 3;
        font-family: "JetBrains Mono", monospace; font-size: calc(18px * var(--scale));
        color: var(--ink-400); letter-spacing: .12em;
      }
      .lockup {
        position: absolute; top: 5.5%; left: 8%; z-index: 4;
        display: flex; align-items: center; gap: 12px; opacity: 0.7;
      }
      .lockup img { width: 30px; height: 30px; }
      .lockup span { font-family: "JetBrains Mono", monospace; font-size: calc(15px * var(--scale)); font-weight: 700; color: var(--ink-300); letter-spacing: .14em; }
    </style>
  </head>
  <body>
    <div
      id="slide-{{IDX}}"
      data-composition-id="keypoint-{{IDX}}"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
      data-start="{{START}}"
      data-duration="{{DURATION}}"
    >
      <svg id="bg-grid" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1920 1080">
        <defs>
          <pattern id="grid-pat-kp-{{IDX}}" width="64" height="64" patternUnits="userSpaceOnUse">
            <path d="M64 0 H0 V64" fill="none" stroke="rgba(23,23,23,0.04)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#grid-pat-kp-{{IDX}})"/>
      </svg>
      <div class="accent-rule"></div>

      <div class="lockup"><img src="{{LOGO}}" alt="" /><span>LONG CIPHER</span></div>

      <div class="stage">
        <div class="eyebrow">{{EYEBROW}}</div>
        <div class="statement">{{STATEMENT}}</div>
        <div class="support">{{SUPPORT}}</div>
      </div>
      <div class="idx-tag">{{IDX_LABEL}}</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(".lockup", { autoAlpha: 0 }, { autoAlpha: 0.7, duration: 0.4 }, 0.05);
      tl.fromTo(".accent-rule", { scaleY: 0, transformOrigin: "top" }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".eyebrow", { x: -16, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 0.25);
      tl.fromTo(".statement", { y: 26, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.8, ease: "power3.out" }, 0.4);
      if (document.querySelector(".support") && document.querySelector(".support").textContent.trim()) {
        tl.fromTo(".support", { y: 18, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 0.8);
      }
      tl.fromTo(".idx-tag", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 0.6);
      window.__timelines["keypoint-{{IDX}}"] = tl;
    </script>
  </body>
</html>
