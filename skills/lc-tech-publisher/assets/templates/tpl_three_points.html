<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-points-{{IDX}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #fafbfc; --surface: #ffffff; --ink: #171718;
        --ink-200: #4e5159; --ink-300: #6b6e75; --ink-400: #888d98;
        --line: #e0e2e8; --line-strong: #b4b8c2;
        --accent: #0a72ef; --accent-soft: rgba(10,114,239,0.10); --accent-hair: rgba(10,114,239,0.40);
        --shadow-rest: rgba(23,23,23,0.06) 0 0 0 1px, rgba(23,23,23,0.04) 0 1px 2px, #ffffff 0 0 0 1px inset;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{WIDTH}}px; height: {{HEIGHT}}px; background: var(--canvas);
        overflow: hidden; font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      [data-composition-id] { position: relative; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; }

      #bg-grid { position: absolute; inset: 0; z-index: 0; }
      .lockup {
        position: absolute; top: 5.5%; left: 6%; z-index: 4;
        display: flex; align-items: center; gap: 12px; opacity: 0.7;
      }
      .lockup img { width: 30px; height: 30px; }
      .lockup span { font-family: "JetBrains Mono", monospace; font-size: calc(15px * var(--scale)); font-weight: 700; color: var(--ink-300); letter-spacing: .14em; }

      .wrap { position: absolute; inset: 0; z-index: 3; padding: 11% 7% 8%; display: flex; flex-direction: column; }
      .head { display: flex; align-items: baseline; gap: 16px; margin-bottom: calc(34px * var(--scale)); }
      .head .tag {
        font-family: "JetBrains Mono", monospace; font-size: calc(18px * var(--scale));
        color: var(--accent); letter-spacing: .14em; text-transform: uppercase;
        border: 1px solid var(--accent-hair); padding: 4px 10px;
      }
      .head h2 { font-size: calc(40px * var(--scale)); font-weight: 700; letter-spacing: -0.01em; color: var(--ink); }

      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(28px * var(--scale)); flex: 1; min-height: 0; }
      .point {
        background: var(--surface); box-shadow: var(--shadow-rest); border-radius: 2px;
        padding: calc(34px * var(--scale)) calc(32px * var(--scale));
        display: flex; flex-direction: column; gap: calc(16px * var(--scale));
      }
      .point .no {
        font-family: "JetBrains Mono", monospace; font-size: calc(46px * var(--scale));
        font-weight: 700; color: var(--accent); line-height: 1; letter-spacing: -.02em;
      }
      .point .pt-title { font-size: calc(30px * var(--scale)); font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
      .point .bar { width: 40px; height: 2px; background: var(--line-strong); }
      .point .pt-body { font-size: calc(21px * var(--scale)); font-weight: 400; color: var(--ink-200); line-height: 1.5; }
    </style>
  </head>
  <body>
    <div
      id="slide-{{IDX}}"
      data-composition-id="three-{{IDX}}"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
      data-start="{{START}}"
      data-duration="{{DURATION}}"
    >
      <svg id="bg-grid" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1920 1080">
        <defs>
          <pattern id="grid-pat-3p-{{IDX}}" width="64" height="64" patternUnits="userSpaceOnUse">
            <path d="M64 0 H0 V64" fill="none" stroke="rgba(23,23,23,0.04)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#grid-pat-3p-{{IDX}})"/>
      </svg>
      <div class="lockup"><img src="{{LOGO}}" alt="" /><span>LONG CIPHER</span></div>

      <div class="wrap">
        <div class="head">
          <span class="tag">SUMMARY</span>
          <h2>{{TITLE}}</h2>
        </div>
        <div class="grid">
{{POINTS}}
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(".lockup", { autoAlpha: 0 }, { autoAlpha: 0.7, duration: 0.4 }, 0.05);
      tl.fromTo(".head", { y: -16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 0.15);
      tl.fromTo(".point", { y: 28, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out", stagger: 0.12 }, 0.35);
      window.__timelines["three-{{IDX}}"] = tl;
    </script>
  </body>
</html>
