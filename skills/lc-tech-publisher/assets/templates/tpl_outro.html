<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>outro-{{IDX}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #fafbfc; --surface: #ffffff; --ink: #171718;
        --ink-200: #4e5159; --ink-300: #6b6e75; --ink-400: #888d98;
        --line: #e0e2e8; --line-strong: #b4b8c2;
        --accent: #0a72ef; --accent-soft: rgba(10,114,239,0.10); --accent-hair: rgba(10,114,239,0.40);
        --shadow-rest: rgba(23,23,23,0.06) 0 0 0 1px, rgba(23,23,23,0.04) 0 1px 2px, #ffffff 0 0 0 1px inset;
        --shadow-elev: rgba(23,23,23,0.10) 0 0 0 1px, rgba(23,23,23,0.10) 0 4px 12px, rgba(23,23,23,0.06) 0 12px 28px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: {{WIDTH}}px; height: {{HEIGHT}}px; background: var(--canvas);
        overflow: hidden; font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      [data-composition-id] { position: relative; width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden; }

      #bg-grid { position: absolute; inset: 0; z-index: 0; }

      .card {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 70%; background: var(--surface); box-shadow: var(--shadow-elev); border-radius: 2px;
        padding: calc(54px * var(--scale)) calc(56px * var(--scale)); z-index: 3;
        text-align: center;
      }
      .card .kicker {
        font-family: "JetBrains Mono", monospace; font-size: calc(18px * var(--scale));
        letter-spacing: .18em; text-transform: uppercase; color: var(--accent);
        margin-bottom: calc(26px * var(--scale)); display: inline-flex; align-items: center; gap: 14px;
      }
      .card .kicker::before, .card .kicker::after { content: ""; width: 26px; height: 2px; background: var(--accent); }
      .card .recap { font-size: calc(38px * var(--scale)); font-weight: 700; line-height: 1.34; letter-spacing: -0.01em; color: var(--ink); max-width: 1300px; margin: 0 auto; }
      .card .divider { width: 64px; height: 2px; background: var(--accent); margin: calc(34px * var(--scale)) auto; }
      .card .signoff { font-family: "JetBrains Mono", monospace; font-size: calc(20px * var(--scale)); color: var(--ink-300); letter-spacing: .14em; text-transform: uppercase; }

      .lockup {
        position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%); z-index: 4;
        display: flex; align-items: center; gap: 12px; opacity: 0.75;
      }
      .lockup img { width: 32px; height: 32px; }
      .lockup span { font-family: "JetBrains Mono", monospace; font-size: calc(16px * var(--scale)); font-weight: 700; color: var(--ink-300); letter-spacing: .14em; }
    </style>
  </head>
  <body>
    <div
      id="slide-{{IDX}}"
      data-composition-id="outro-{{IDX}}"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
      data-start="{{START}}"
      data-duration="{{DURATION}}"
    >
      <svg id="bg-grid" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1920 1080">
        <defs>
          <pattern id="grid-pat-out-{{IDX}}" width="64" height="64" patternUnits="userSpaceOnUse">
            <path d="M64 0 H0 V64" fill="none" stroke="rgba(23,23,23,0.04)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#grid-pat-out-{{IDX}})"/>
      </svg>

      <div class="card">
        <div class="kicker">WRAP-UP</div>
        <div class="recap">{{RECAP}}</div>
        <div class="divider"></div>
        <div class="signoff">{{SIGNOFF}}</div>
      </div>

      <div class="lockup"><img src="{{LOGO}}" alt="" /><span>LONG CIPHER</span></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(".card", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 0.15);
      tl.fromTo(".kicker", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 0.4);
      tl.fromTo(".recap", { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 0.5);
      tl.fromTo(".divider", { scaleX: 0, transformOrigin: "center" }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.8);
      tl.fromTo(".signoff", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 1.0);
      tl.fromTo(".lockup", { autoAlpha: 0 }, { autoAlpha: 0.75, duration: 0.4 }, 0.6);
      window.__timelines["outro-{{IDX}}"] = tl;
    </script>
  </body>
</html>
