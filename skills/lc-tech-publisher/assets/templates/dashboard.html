<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <style>
      /* Self-hosted brand fonts (assets/fonts, copied by build scripts) — no CDN dependency. */
      @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400; font-display: swap; src: url("assets/fonts/dm-sans-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 500; font-display: swap; src: url("assets/fonts/dm-sans-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 600; font-display: swap; src: url("assets/fonts/dm-sans-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 700; font-display: swap; src: url("assets/fonts/dm-sans-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 800; font-display: swap; src: url("assets/fonts/dm-sans-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 700; font-display: swap; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
    </style>
    <script src="assets/vendor/gsap.min.js" onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js';document.head.appendChild(s);"></script>
    <style>
      :root {
        --canvas: #fafbfc; --surface: #ffffff; --ink: #171718;
        --ink-200: #4e5159; --ink-300: #565a63; --ink-400: #6b6e75;
        --line: #e0e2e8; --line-strong: #b4b8c2;
        --accent: #0a72ef; --accent-text: #0a63d0; --accent-soft: rgba(10,114,239,0.10); --accent-hair: rgba(10,114,239,0.40);
        --shadow-rest: rgba(23,23,23,0.06) 0 0 0 1px, rgba(23,23,23,0.04) 0 1px 2px, #ffffff 0 0 0 1px inset;
        --shadow-elev: rgba(23,23,23,0.10) 0 0 0 1px, rgba(23,23,23,0.10) 0 4px 12px, rgba(23,23,23,0.06) 0 12px 28px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; background: var(--canvas); overflow: hidden;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      [data-composition-id] { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      #bg-grid { position: absolute; inset: 0; z-index: 0; }

      /* L0 atmosphere canvas — deterministic Canvas 2D (ambient grid pulse +
         particle field + drifting glow blobs). Redrawn on every GSAP timeline
         seek via onUpdate reading tl.time() — no Date.now()/requestAnimationFrame. */
      #atmo { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

      /* scene-switch beam — a vertical brand-blue gradient bar that sweeps
         left→right once at each slide transition (CanvasUI "laser scan" feel) */
      #scanline { position: absolute; top: 0; bottom: 0; width: 160px; left: 0; z-index: 2;
        pointer-events: none; opacity: 0;
        background: linear-gradient(90deg, transparent, var(--accent-hair), var(--accent-soft), var(--accent-hair), transparent); }

      /* playful background decorations — tiny brand-blue glyphs at the frame
         edges, below the slides so they never fight the content */
      #bg-deco { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
      #bg-deco .deco { position: absolute; will-change: transform; }
      #bg-deco .deco svg { width: 100%; height: 100%; display: block; }

      /* Layer 1 — persistent brand header: lockup + date/kicker + timeline
         progress bar. Shown on content slides (hidden during the cover, which
         carries its own lockup). */
      #header { position: absolute; top: 0; left: 0; right: 0; height: 96px; z-index: 6;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 6%; pointer-events: none; opacity: 0; visibility: hidden; }
      #header .hd-lockup { display: flex; align-items: center; gap: 12px; }
      #header .hd-lockup img { width: 30px; height: 30px; }
      #header .hd-lockup span { font-family:"DM Sans",sans-serif; font-size: 17px; font-weight: 700;
        color: var(--ink-300); letter-spacing: -0.02em; }
      #header .hd-meta { display: flex; align-items: center; gap: 18px;
        font-family:"JetBrains Mono",monospace; font-size: 15px; letter-spacing: .1em;
        text-transform: uppercase; color: var(--ink-400); }
      #header .hd-meta .hd-date { color: var(--accent-text); font-weight: 700; }
      #header .hd-progress { position: absolute; left: 6%; right: 6%; bottom: 0; height: 2px;
        background: var(--line); }
      #header .hd-progress .hd-progress-fill { height: 100%; width: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-text));
        transform: scaleX(0); transform-origin: left; }

      #stage { position: absolute; inset: 0; z-index: 5; }

      /* embedded single-line caption (bottom) — one line at a time */
      .cap { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
        max-width: 1500px; width: max-content; z-index: 30;
        padding: 12px 28px; background: rgba(255,255,255,0.95);
        border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 2px;
        box-shadow: var(--shadow-rest);
        font-size: 28px; font-weight: 600; line-height: 1; color: var(--ink);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
        display: block; opacity: 0; visibility: hidden;
      }

    </style>
  </head>
  <body>
    <div
      id="master"
      data-composition-id="master"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="{{DURATION}}"
    >
      <svg id="bg-grid" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1920 1080">
        <defs>
          <pattern id="grid-pat" width="64" height="64" patternUnits="userSpaceOnUse">
            <path d="M64 0 H0 V64" fill="none" stroke="rgba(23,23,23,0.04)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#grid-pat)"/>
      </svg>

      <!-- L0 atmosphere: deterministic Canvas 2D layer (ambient grid pulse +
           particle field + drifting glow blobs). Redrawn on every GSAP timeline
           seek via onUpdate — no Date.now()/requestAnimationFrame. -->
      <canvas id="atmo" width="1920" height="1080"></canvas>

      <!-- scene-switch beam (CanvasUI laser-scan transition) -->
      <div class="scanline" id="scanline"></div>

      <!-- playful background decorations (fixed hand-built set, animated by GSAP) -->
      <div id="bg-deco"></div>

      <!-- Layer 1 — persistent brand header (lockup + date + progress bar) -->
      <div id="header" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="7" data-layout-allow-overlap aria-hidden="true">
        <div class="hd-lockup"><img src="logos/lc.svg" alt=""><span>LongCipher</span></div>
        <div class="hd-meta"><span class="hd-date"></span><span class="hd-kicker"></span></div>
        <div class="hd-progress"><div class="hd-progress-fill"></div></div>
      </div>

      <div id="stage" data-layout-allow-overlap><!-- slides injected by build_composition.py --></div>

      <div id="captions"></div>
      <div id="audio-clips"></div>
    </div>

    <script>window.LC_DATA = {}; /* replaced by build_composition.py */</script>
    <script>
      window.__timelines = window.__timelines || {};
      var DATA = window.LC_DATA || {};
      var ACC = "#0a72ef";
      var LOCKUP = '<div class="lockup"><img src="'+esc(DATA.logo||"logos/lc.svg")+'" alt=""><span>LongCipher</span></div>';
      function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function mono(s){ return '<span style="font-family:\'JetBrains Mono\',monospace">'+esc(s)+"</span>"; }
      /* Kinetic typography: `**keyword**` in any copy becomes a highlighted
         accent span (L3). The LLM marks the word that carries the semantic
         weight; the template owns the styling. */
      function hl(s){
        return String(s==null?"":s).replace(/\*\*([^*]+)\*\*/g, '<span class="kt-hl">$1</span>');
      }
      function escHl(s){ return hl(esc(s)); }

      /* Cute flat illustration catalog — injected by build_composition.py from
         assets/templates/_icons.js (single source of truth). The LLM picks a
         key via the `icon` field; unknown keys fall back to "spark". */
{{ICONS_JS}}
      function iconSVG(name){
        return ICONS[name] || ICONS.spark;
      }

      /* ── Content-aware visualizer builders (Layer 2) ──
         Each returns HTML for the right-column dynamic visual card. The LLM
         only supplies structured data via the `visual` field; the template owns
         all markup + animation. All motion is GSAP-driven (deterministic). */

      /* metric_chart — animated SVG line chart (prices / TVL / mining balances).
         The polyline draws in left→right, the area fades in, data dots pop, and
         the latest point carries a breathing halo. */
      function metricChartHTML(d){
        var pts = (d.points||[]).map(function(v){ return parseFloat(v)||0; });
        var labels = d.labels||[];
        var unit = d.unit||"";
        var max = d.max||0;
        pts.forEach(function(v){ if (v > max) max = v; });
        if (max <= 0) max = 1;
        var W = 560, H = 300, pad = 34;
        var n = Math.max(pts.length, 2);
        var stepX = (W - 2*pad) / (n - 1);
        var coords = pts.map(function(v, i){
          return [ pad + i*stepX, H - pad - (v/max)*(H - 2*pad) ];
        });
        var line = coords.map(function(c){ return c[0].toFixed(1)+","+c[1].toFixed(1); }).join(" ");
        var area = pad+","+(H-pad)+" "+line+" "+(W-pad)+","+(H-pad);
        var dots = coords.map(function(c, i){
          return '<circle class="mc-dot" data-dot="'+i+'" cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="5" fill="#ffffff" stroke="#0a72ef" stroke-width="3"/>'
            + (i === coords.length-1 ? '<circle class="mc-halo" data-halo="1" cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="12" fill="none" stroke="rgba(10,114,239,0.35)" stroke-width="2"/>' : '');
        }).join("");
        var xlabels = labels.map(function(l, i){
          return '<text class="mc-xlabel" x="'+coords[i][0].toFixed(1)+'" y="'+(H-pad+26)+'" text-anchor="middle">'+esc(l)+'</text>';
        }).join("");
        var vlabels = coords.map(function(c, i){
          return '<text class="mc-vlabel" data-vlabel="'+i+'" x="'+c[0].toFixed(1)+'" y="'+(c[1]-14).toFixed(1)+'" text-anchor="middle">0</text>';
        }).join("");
        return '<div class="viz-card mc-card" data-pts="'+pts.join(",")+'">'
          + '<div class="viz-head"><span class="viz-tag">CHART</span><span class="viz-title">'+esc(d.title||"")+'</span><span class="viz-unit">'+esc(unit)+'</span></div>'
          + '<svg class="mc-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'
          +   '<defs><linearGradient id="mc-fill" x1="0" y1="0" x2="0" y2="1">'
          +     '<stop offset="0" stop-color="rgba(10,114,239,0.18)"/><stop offset="1" stop-color="rgba(10,114,239,0)"/></linearGradient></defs>'
          +   '<polygon class="mc-area" points="'+area+'" fill="url(#mc-fill)"/>'
          +   '<polyline class="mc-line" points="'+line+'" fill="none" stroke="#0a72ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'
          +   dots + xlabels + vlabels
          + '</svg>'
          + '</div>';
      }

      /* pipeline — animated node/data-flow diagram (infra / MEV / protocol).
         Nodes light up in sequence; a data packet pulses along each link. */
      function pipelineHTML(d){
        var nodes = d.nodes||[];
        var links = d.links||[]; // optional explicit link labels
        var out = '<div class="viz-card pipe-card">'
          + '<div class="viz-head"><span class="viz-tag">FLOW</span><span class="viz-title">'+esc(d.title||"")+'</span></div>'
          + '<div class="pipe">';
        nodes.forEach(function(nd, i){
          out += '<div class="pipe-node" data-pipe="'+i+'">'
            + '<div class="pn-ring"><span class="pn-idx">'+String(i+1).padStart(2,"0")+'</span></div>'
            + '<div class="pn-label">'+esc(nd)+'</div>'
            + '</div>';
          if (i < nodes.length-1) {
            out += '<div class="pipe-link" data-link="'+i+'">'
              + '<div class="pl-line"></div>'
              + '<span class="pl-packet"></span>'
              + (links && links[i] ? '<span class="pl-label">'+esc(links[i])+'</span>' : '')
              + '</div>';
          }
        });
        out += '</div></div>';
        return out;
      }

      /* benchmark — live comparison bars (AI tok/s, TPS). Horizontal bars fill
         left→right with count-up values. */
      function benchmarkHTML(d){
        var bars = (d.bars||[]).map(function(b){
          return { label: b.label||"", value: parseFloat(b.value)||0, suffix: b.suffix||"" };
        });
        var max = d.max||0;
        bars.forEach(function(b){ if (b.value > max) max = b.value; });
        if (max <= 0) max = 1;
        var items = bars.map(function(b, i){
          var pct = Math.round((b.value/max)*100);
          return '<div class="bm-item" data-bm="'+i+'" data-val="'+b.value+'" data-suffix="'+esc(b.suffix)+'" data-pct="'+pct+'">'
            + '<div class="bm-label">'+esc(b.label)+'</div>'
            + '<div class="bm-track"><div class="bm-fill"></div></div>'
            + '<div class="bm-val">0</div>'
            + '</div>';
        }).join("");
        return '<div class="viz-card bm-card">'
          + '<div class="viz-head"><span class="viz-tag">BENCH</span><span class="viz-title">'+esc(d.title||"")+'</span><span class="viz-unit">'+esc(d.unit||"")+'</span></div>'
          + '<div class="bm-list">'+items+'</div>'
          + '</div>';
      }

      /* security — pulsing CVSS gauge + port vulnerability warning card. */
      function securityHTML(d){
        var cvss = parseFloat(d.cvss)||0;
        var sev = cvss >= 9 ? "CRITICAL" : (cvss >= 7 ? "HIGH" : (cvss >= 4 ? "MEDIUM" : "LOW"));
        var ports = d.ports||[];
        var portChips = ports.map(function(p){ return '<span class="sec-port">'+esc(p)+'</span>'; }).join("");
        // semicircle gauge: needle angle 180°→0° mapped from 0→10
        var ang = 180 - (cvss/10)*180;
        return '<div class="viz-card sec-card">'
          + '<div class="viz-head"><span class="viz-tag">ALERT</span><span class="viz-title">'+esc(d.title||"")+'</span></div>'
          + '<div class="sec-body">'
          +   '<div class="sec-gauge">'
          +     '<svg class="sec-svg" viewBox="0 0 200 120">'
          +       '<path d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="rgba(23,23,23,0.08)" stroke-width="14" stroke-linecap="round"/>'
          +       '<path class="sec-arc" d="M20 110 A80 80 0 0 1 180 110" fill="none" stroke="#0a72ef" stroke-width="14" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251"/>'
          +       '<g class="sec-needle" style="transform-origin:100px 110px">'
          +         '<line x1="100" y1="110" x2="100" y2="40" stroke="#0a63d0" stroke-width="4" stroke-linecap="round"/>'
          +         '<circle cx="100" cy="110" r="6" fill="#0a72ef"/>'
          +       '</g>'
          +     '</svg>'
          +     '<div class="sec-score"><span class="sec-num" data-cvss="'+cvss+'">0.0</span><span class="sec-sev">'+sev+'</span></div>'
          +   '</div>'
          +   '<div class="sec-side">'
          +     '<div class="sec-pulse"><span class="sec-pulse-dot"></span><span class="sec-pulse-txt">'+esc(d.pulse||"高危扩散")+'</span></div>'
          +     (portChips ? '<div class="sec-ports"><span class="sec-ports-label">PORTS</span><div class="sec-ports-list">'+portChips+'</div></div>' : '')
          +     (d.note ? '<div class="sec-note">'+esc(d.note)+'</div>' : '')
          +   '</div>'
          + '</div>'
          + '</div>';
      }

      /* terminal — syntax-flavored animated code block (Rust / smart-contract
         releases). Lines type in with a mono caret. */
      function terminalHTML(d){
        var lines = d.lines||[];
        var items = lines.map(function(l, i){
          var cls = "term-line";
          if (l.indexOf("$") === 0) cls += " term-cmd";
          else if (l.indexOf(">") === 0) cls += " term-out";
          return '<div class="'+cls+'" data-term="'+i+'">'+esc(l)+'</div>';
        }).join("");
        return '<div class="viz-card term-card">'
          + '<div class="term-bar"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span><span class="term-title">'+esc(d.title||"terminal")+'</span></div>'
          + '<div class="term-body">'+items+'<span class="term-caret"></span></div>'
          + '</div>';
      }

      /* Route a slide's `visual` field to its builder. Returns "" if none. */
      function visualHTML(s){
        var v = s.visual;
        if (!v) return "";
        if (v === "metric_chart") return metricChartHTML(s.chart||{});
        if (v === "pipeline") return pipelineHTML(s.pipeline||{});
        if (v === "benchmark") return benchmarkHTML(s.benchmark||{});
        if (v === "security") return securityHTML(s.security||{});
        if (v === "terminal") return terminalHTML(s.terminal||{});
        return "";
      }

      /* ── Build slides ── */
      var slides = DATA.slides || [];
      var html = "";

      // Slide 0 = cover (hero), always present.
      var c = DATA.cover || {};
      var headlines = (c.headlines||[]).map(function(h){
        return '<li><span class="hl-idx">›</span><span class="hl-txt">'+esc(h)+'</span></li>';
      }).join("");
      html += ''
        + '<section class="slide" id="slide-0" data-s="0">'
        +   LOCKUP
        +   '<div class="corner-tag">'+esc(c.cornerTag||c.kicker||"BRIEF")+'</div>'
        +   '<div class="center">'
        +     '<div class="kicker">'+esc(c.kicker||"")+'</div>'
        +     '<div class="title">'+esc(c.title||"").replace(/\\n/g,"<br>")+'</div>'
        +     '<div class="sub">'+esc(c.subtitle||"").replace(/\\n/g,"<br>")+'</div>'
        +     (headlines ? '<div class="headlines"><div class="hl-head">'+esc(c.headlinesLabel||meta.headlinesLabel||"TODAY’S FOCUS")+'</div><ul>'+headlines+'</ul></div>' : '')
        +   '</div>'
        +   '<div class="meta-row"><span class="left">'+esc(c.metaLeft||"")+'</span><span class="center-bar"></span><span class="right">'+esc(c.metaRight||"")+'</span></div>'
        + '</section>';

      // Slides 1..n from data.
      slides.forEach(function(s, i){
        var n = i + 1;
        var sStart = s._start != null ? s._start : 0;
        var sEnd   = s._end   != null ? s._end   : sStart + 8;
        var sAttrs = ' data-start="'+sStart+'" data-end="'+sEnd+'" data-layout-allow-overlap';
        var visual = visualHTML(s);
        var hasVisual = visual ? " has-visual" : "";
        if (s.type === "keypoint") {
          var bullets = (s.bullets||[]).map(function(b){
            return '<li><span class="b-dot"></span><span class="b-txt">'+escHl(b)+'</span></li>';
          }).join("");
          var callbacks = (s.callback||[]).map(function(cb){
            return '<span class="cb-tag"><span class="cb-arrow">↳</span><span class="cb-txt">'+esc(cb)+'</span></span>';
          }).join("");
          var bodyParas = (s.body||[]).map(function(p){
            return '<p class="body-para">'+escHl(p)+'</p>';
          }).join("");
          html += ''
            + '<section class="slide'+(s.icon?' has-illust':'')+hasVisual+'" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   '<div class="accent-rule"></div>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="stage">'
            +     '<div class="eyebrow">'+esc(s.eyebrow||"核心观点")+'</div>'
            +     '<div class="statement">'+escHl(s.statement||"")+'</div>'
            +     (s.support ? '<div class="support">'+escHl(s.support)+'</div>' : '')
            +     (bodyParas ? '<div class="body">'+bodyParas+'</div>' : '')
            +     (bullets ? '<ul class="bullets">'+bullets+'</ul>' : '')
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+escHl(s.analysis)+'</span></div>' : '')
            +     (callbacks ? '<div class="callbacks">'+callbacks+'</div>' : '')
            +   '</div>'
            +   (visual ? '<div class="visual" data-visual="'+esc(s.visual)+'">'+visual+'</div>' : '')
            +   '<div class="idx-tag">'+String(n).padStart(2,"0")+' / '+String(slides.length).padStart(2,"0")+'</div>'
            + '</section>';
        } else if (s.type === "three_points") {
          var pts = (s.points||[]).map(function(p){
            return '<div class="point">'
              + '<div class="no">'+esc(p.no||"")+'</div>'
              + '<div class="pt-title">'+esc(p.title||"")+'</div>'
              + '<div class="bar"></div>'
              + '<div class="pt-body">'+esc(p.body||"")+'</div>'
              + '</div>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">SUMMARY</span><h2>'+esc(s.title||"三点总结")+'</h2></div>'
            +     '<div class="grid">'+pts+'</div>'
            +   '</div>'
            + '</section>';
        } else if (s.type === "outro") {
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="card">'
            +     '<div class="kicker">WRAP-UP</div>'
            +     '<div class="recap">'+esc(s.recap||"")+'</div>'
            +     '<div class="divider"></div>'
            +     '<div class="signoff">'+esc(s.signoff||"LongCipher")+'</div>'
            +   '</div>'
            + '</section>';
        } else if (s.type === "table") {
          var numCols = (s.numCols||[]);
          var headCells = (s.head||[]).map(function(h){ return '<th>'+esc(h)+'</th>'; }).join("");
          var bodyRows = (s.rows||[]).map(function(r){
            var cells = (r||[]).map(function(c, ci){
              return '<td'+(numCols.indexOf(ci)>=0?' class="num"':'')+'>'+esc(c)+'</td>';
            }).join("");
            return '<tr>'+cells+'</tr>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">DATA</span><h2>'+esc(s.title||"数据一览")+'</h2></div>'
            +     '<div class="tbl-card">'
            +       '<table class="tbl"><thead><tr>'+headCells+'</tr></thead><tbody>'+bodyRows+'</tbody></table>'
            +     '</div>'
            +   '</div>'
            + '</section>';
        } else if (s.type === "chart") {
          // Dither-style bar chart — bars grow up + value counters roll, all
          // driven by the GSAP timeline (deterministic, no Date.now()).
          var chartBars = (s.bars||[]).map(function(b){
            return { label: b.label||"", value: parseFloat(b.value)||0, suffix: b.suffix||"" };
          });
          var chartMax = s.max || 0;
          chartBars.forEach(function(b){ if (b.value > chartMax) chartMax = b.value; });
          if (chartMax <= 0) chartMax = 1;
          var chartHtml = chartBars.map(function(b, bi){
            var pct = Math.round((b.value / chartMax) * 100);
            return '<div class="bar-item" data-bar="'+bi+'" data-val="'+b.value+'" data-suffix="'+esc(b.suffix)+'" data-pct="'+pct+'">'
              + '<div class="bar-track"><div class="bar-fill"></div></div>'
              + '<div class="bar-val">0</div>'
              + '<div class="bar-label">'+esc(b.label)+'</div>'
              + '</div>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">CHART</span><h2>'+esc(s.title||"数据对比")+'</h2></div>'
            +     '<div class="chart-card">'
            +       '<div class="chart-bars">'+chartHtml+'</div>'
            +     '</div>'
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+esc(s.analysis)+'</span></div>' : '')
            +   '</div>'
            + '</section>';
        } else if (s.type === "counter") {
          // Big animated metric counter — the number rolls up to its target.
          var cVal = parseFloat(s.value)||0;
          var cSuffix = s.suffix||"";
          var cPrefix = s.prefix||"";
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">METRIC</span><h2>'+esc(s.title||"关键指标")+'</h2></div>'
            +     '<div class="counter-card">'
            +       '<div class="counter-eyebrow">'+esc(s.eyebrow||"")+'</div>'
            +       '<div class="counter-num" data-val="'+cVal+'" data-prefix="'+esc(cPrefix)+'" data-suffix="'+esc(cSuffix)+'">'+esc(cPrefix)+'0'+esc(cSuffix)+'</div>'
            +       (s.delta ? '<div class="counter-delta">'+esc(s.delta)+'</div>' : '')
            +       '<div class="counter-label">'+esc(s.label||"")+'</div>'
            +       (s.note ? '<div class="counter-note">'+esc(s.note)+'</div>' : '')
            +     '</div>'
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+esc(s.analysis)+'</span></div>' : '')
            +   '</div>'
            + '</section>';
        } else if (s.type === "cards") {
          // 3D card spread — stacked cards fan out to reveal feature/matrix items.
          var cardItems = (s.cards||[]).map(function(cd, ci){
            return '<div class="spread-card" data-card="'+ci+'">'
              + '<div class="sc-no">'+esc(cd.no||String(ci+1).padStart(2,"0"))+'</div>'
              + '<div class="sc-title">'+esc(cd.title||"")+'</div>'
              + '<div class="sc-body">'+esc(cd.body||"")+'</div>'
              + '</div>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">MATRIX</span><h2>'+esc(s.title||"能力矩阵")+'</h2></div>'
            +     '<div class="spread">'+cardItems+'</div>'
            +   '</div>'
            + '</section>';
        } else if (s.type === "steps") {
          // Process / flow — nodes connected by a line that draws in, each node pulses.
          var stepItems = (s.steps||[]).map(function(st, si){
            return '<div class="step" data-step="'+si+'">'
              + '<div class="step-node"><span>'+esc(st.no||String(si+1))+'</span></div>'
              + '<div class="step-title">'+esc(st.title||"")+'</div>'
              + '<div class="step-body">'+esc(st.body||"")+'</div>'
              + '</div>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">FLOW</span><h2>'+esc(s.title||"流程拆解")+'</h2></div>'
            +     '<div class="steps">'+stepItems+'</div>'
            +   '</div>'
            + '</section>';
        } else if (s.type === "metric_chart") {
          // standalone line-chart slide (right-column visualizer as the hero)
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">TREND</span><h2>'+esc(s.title||"趋势")+'</h2></div>'
            +     '<div class="viz-standalone">'+metricChartHTML(s.chart||{})+'</div>'
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+esc(s.analysis)+'</span></div>' : '')
            +   '</div>'
            + '</section>';
        } else if (s.type === "pipeline") {
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">ARCH</span><h2>'+esc(s.title||"架构")+'</h2></div>'
            +     '<div class="viz-standalone">'+pipelineHTML(s.pipeline||{})+'</div>'
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+esc(s.analysis)+'</span></div>' : '')
            +   '</div>'
            + '</section>';
        } else if (s.type === "benchmark") {
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">BENCH</span><h2>'+esc(s.title||"性能对比")+'</h2></div>'
            +     '<div class="viz-standalone">'+benchmarkHTML(s.benchmark||{})+'</div>'
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+esc(s.analysis)+'</span></div>' : '')
            +   '</div>'
            + '</section>';
        } else if (s.type === "security") {
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">SECURITY</span><h2>'+esc(s.title||"安全告警")+'</h2></div>'
            +     '<div class="viz-standalone">'+securityHTML(s.security||{})+'</div>'
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+esc(s.analysis)+'</span></div>' : '')
            +   '</div>'
            + '</section>';
        } else if (s.type === "terminal") {
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">CODE</span><h2>'+esc(s.title||"代码")+'</h2></div>'
            +     '<div class="viz-standalone">'+terminalHTML(s.terminal||{})+'</div>'
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+esc(s.analysis)+'</span></div>' : '')
            +   '</div>'
            + '</section>';
        }
      });
      document.getElementById("stage").innerHTML = html;

      /* ── Captions (one line per cue, refreshed in step with audio) ── */
      var caps = "";
      var cueIdx = 0;
      (DATA.turns||[]).forEach(function(t){
        var cues = t.cues && t.cues.length ? t.cues : [{ text: t.text, speaker: t.speaker, start: t.start, end: t.end }];
        cues.forEach(function(c){
          var sp = c.speaker === "female" ? " sp-f" : "";
          caps += '<div class="cap clip'+sp+'" data-cap="'+cueIdx+'" data-start="'+c.start+'" data-duration="'+((c.end-c.start)).toFixed(3)+'" data-track-index="100">'+esc(c.text)+'</div>';
          cueIdx++;
        });
      });
      document.getElementById("captions").innerHTML = caps;

      /* ── Audio ── */
      var aud = "";
      (DATA.turns||[]).forEach(function(t,i){
        aud += '<audio class="clip" src="'+t.file+'" data-start="'+t.start+'" data-duration="'+t.duration+'" data-track-index="'+(200+i)+'" data-volume="1"></audio>';
      });
      document.getElementById("audio-clips").innerHTML = aud;

      /* ── GSAP timeline ── */
      var tl = gsap.timeline({ paused: true });
      tl.set(".cap", { autoAlpha: 0 }, 0);

      /* ── Persistent header (Layer 1) ──
         Brand lockup + date/kicker + a timeline progress bar that fills across
         the whole video. Hidden during the cover (which has its own lockup),
         revealed when the first content slide begins. */
      (function buildHeader(){
        var hd = document.getElementById("header");
        if (!hd) return;
        var DUR = parseFloat("{{DURATION}}");
        var dateEl = hd.querySelector(".hd-date");
        var kickEl = hd.querySelector(".hd-kicker");
        if (dateEl) dateEl.textContent = DATA.cover && DATA.cover.metaRight ? DATA.cover.metaRight : "";
        if (kickEl) kickEl.textContent = DATA.cover && DATA.cover.kicker ? DATA.cover.kicker : "";
        var firstStart = (slides.length && slides[0]._start != null) ? slides[0]._start : 4.0;
        tl.set(hd, { autoAlpha: 0 }, 0);
        tl.to(hd, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, firstStart);
        // progress bar fills 0→100% across the whole run (deterministic)
        tl.fromTo(hd.querySelector(".hd-progress-fill"), { scaleX: 0, transformOrigin: "left" },
          { scaleX: 1, duration: DUR, ease: "none" }, 0);
      })();

      /* ── Playful background decorations ──
         A fixed, hand-built set of tiny brand-blue glyphs (star, dot, cross,
         ring, square) scattered at the frame edges so they never collide with
         the center content. Each glyph bobs up/down and gently rotates on its
         own phase. Repeat counts are FINITE (derived from the composition
         duration) — the checker rejects repeat:-1 on a finite composition. */
      (function buildDeco(){
        var box = document.getElementById("bg-deco");
        var DUR = parseFloat("{{DURATION}}");
        var glyphs = [
          // type, x%, y%, size, spin(deg), bobAmt
          ["spark", 4, 12, 26, 0, 10], ["spark", 91, 8, 18, 120, 8],
          ["spark", 95, 86, 22, 240, 9], ["spark", 3, 82, 20, 60, 7],
          ["dot", 8, 24, 10, 40, 12], ["dot", 88, 30, 12, 200, 10],
          ["dot", 12, 74, 8, 160, 8], ["dot", 90, 66, 9, 300, 9],
          ["cross", 7, 40, 22, 90, 6], ["cross", 93, 48, 24, 210, 7],
          ["cross", 10, 60, 18, 330, 5], ["cross", 87, 18, 20, 150, 6],
          ["ring", 5, 54, 24, 260, 8], ["ring", 94, 40, 20, 30, 9],
          ["ring", 12, 30, 16, 110, 7], ["ring", 90, 78, 26, 280, 6],
          ["square", 6, 66, 14, 70, 10], ["square", 92, 58, 12, 340, 8],
          ["square", 9, 16, 12, 230, 7], ["square", 88, 90, 16, 20, 9],
        ];
        var T = {
          spark: '<svg viewBox="0 0 64 64"><path d="M32 6 c2.5 14 7 18.5 18 20 c-11 1.5 -15.5 6 -18 20 c-2.5 -14 -7 -18.5 -18 -20 c11 -1.5 15.5 -6 18 -20 Z" fill="rgba(10,114,239,0.14)"/></svg>',
          dot: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="rgba(10,114,239,0.16)"/></svg>',
          cross: '<svg viewBox="0 0 64 64"><path d="M32 12 v40 M12 32 h40" stroke="rgba(10,114,239,0.28)" stroke-width="9" stroke-linecap="round"/></svg>',
          ring: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="16" fill="none" stroke="rgba(10,114,239,0.30)" stroke-width="6"/></svg>',
          square: '<svg viewBox="0 0 64 64"><rect x="14" y="14" width="36" height="36" rx="8" fill="rgba(10,114,239,0.14)"/></svg>',
        };
        glyphs.forEach(function(g, i){
          var el = document.createElement("div");
          el.className = "deco";
          el.style.cssText = "left:"+g[1]+"%;top:"+g[2]+"%;width:"+g[3]+"px;height:"+g[3]+"px;";
          el.innerHTML = T[g[0]];
          box.appendChild(el);
          // every glyph has a unique slow bob + spin over the whole run
          var bobDur = 3.4 + (i % 5) * 0.55;
          var spins = Math.max(2, Math.round((DUR / bobDur)));
          tl.to(el, { y: g[5], rotation: g[4], duration: bobDur, ease:"sine.inOut", yoyo:true, repeat:spins, delay:(i % 3) * 0.35 }, 0);
        });
      })();

      // hero / cover — immediateRender:false so GSAP does NOT hide these at
      // creation time (t=0). They stay visible per their CSS default, so a
      // static preview/poster frame shows the full cover; playback re-reveals.
      tl.fromTo("#slide-0 .corner-tag", { x:16, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.5, immediateRender:false }, 0.1);
      tl.fromTo("#slide-0 .kicker", { x:-16, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.5, ease:"power3.out", immediateRender:false }, 0.2);
      tl.fromTo("#slide-0 .title", { y:26, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.8, ease:"power3.out", immediateRender:false }, 0.35);
      tl.fromTo("#slide-0 .sub", { y:18, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.6, ease:"power2.out", immediateRender:false }, 0.65);
      tl.fromTo("#slide-0 .headlines", { autoAlpha:0 }, { autoAlpha:1, duration:0.5, immediateRender:false }, 0.9);
      tl.fromTo("#slide-0 .headlines li", { x:-16, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.5, stagger:0.1, ease:"power2.out", immediateRender:false }, 1.0);
      tl.fromTo("#slide-0 .meta-row", { y:14, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.5, immediateRender:false }, 0.85);

      // per-slide enter/exit
      var slideEls = Array.prototype.slice.call(document.querySelectorAll(".slide"));
      slideEls.forEach(function(el, i){
        // Tag every slide as a HyperFrames clip with its own time window so the
        // checker knows only one is visible at a time (they overlap in layout).
        el.classList.add("clip");
        if (i === 0) {
          // Cover/hero stays on screen through the intro narration (until the
          // first slide begins) so there is no blank gap after the hero hook.
          var coverEnd = (DATA.coverEnd != null && DATA.coverEnd > 0) ? DATA.coverEnd : 4.0;
          el.setAttribute("data-start", 0);
          el.setAttribute("data-duration", coverEnd);
          el.setAttribute("data-track-index", 10);
          el.classList.add("on");
          return; // cover animations handled above; no autoAlpha toggle needed
        }
        var start = parseFloat(el.getAttribute("data-start") || "0");
        var end = parseFloat(el.getAttribute("data-end") || (start+8));
        el.classList.add("clip");
        el.setAttribute("data-start", start);
        el.setAttribute("data-duration", (end-start));
        el.setAttribute("data-track-index", 10+i);
        tl.add(function(){ el.classList.add("on"); }, start-0.02);
        tl.set(el, { autoAlpha:0 }, start-0.01);
        tl.to(el, { autoAlpha:1, duration:0.5, ease:"power3.out" }, start);

        // CanvasUI laser-scan beam sweeps across at each scene switch
        tl.fromTo("#scanline", { xPercent:-100, autoAlpha:0 }, { xPercent:0, autoAlpha:1, duration:0.35, ease:"power2.inOut" }, start-0.05);
        tl.to("#scanline", { xPercent:100, autoAlpha:0, duration:0.35, ease:"power2.inOut" }, start+0.3);

        if (el.querySelector(".accent-rule")) {
          tl.fromTo(el.querySelector(".accent-rule"), { scaleY:0, transformOrigin:"top" }, { scaleY:1, duration:0.6, ease:"power3.out" }, start+0.1);
        }
        tl.fromTo(el.querySelectorAll(".eyebrow, .head, .kicker"), { x:-16, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.5, ease:"power3.out" }, start+0.2);
        tl.fromTo(el.querySelectorAll(".statement, .recap, .card"), { y:26, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.7, ease:"power3.out" }, start+0.35);
        if (el.querySelectorAll(".body-para").length) {
          tl.fromTo(el.querySelectorAll(".body-para"), { y:18, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.5, ease:"power2.out", stagger:0.12 }, start+0.55);
        }
        if (el.querySelectorAll(".bullets li").length) {
          tl.fromTo(el.querySelectorAll(".bullets li"), { x:-16, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.5, ease:"power2.out", stagger:0.1 }, start+0.7);
        }
        tl.fromTo(el.querySelectorAll(".point"), { y:28, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.6, ease:"power3.out", stagger:0.12 }, start+0.4);
        tl.fromTo(el.querySelectorAll(".support, .signoff, .divider"), { autoAlpha:0 }, { autoAlpha:1, duration:0.5 }, start+0.7);
        // cute illustration: pop in with a gentle overshoot, then a soft idle
        // wobble. Repeat is FINITE and derived from the slide window so it
        // always covers the slide without an infinite loop (the checker
        // rejects repeat:-1 on a finite composition).
        if (el.querySelector(".illust")) {
          var wobbleCycles = Math.max(2, Math.round((end - start - 1.0) / 0.9));
          tl.fromTo(el.querySelector(".illust"), { scale:0.6, autoAlpha:0, transformOrigin:"center" },
            { scale:1, autoAlpha:1, duration:0.5, ease:"back.out(1.7)" }, start+0.3);
          tl.to(el.querySelector(".illust"), { rotation:6, duration:0.9, ease:"sine.inOut", yoyo:true, repeat:wobbleCycles }, start+1.0);
        }
        if (el.querySelector(".analysis")) {
          tl.fromTo(el.querySelector(".analysis"), { y:18, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.5, ease:"power2.out" }, start+0.8);
        }
        if (el.querySelector(".callbacks")) {
          tl.fromTo(el.querySelectorAll(".cb-tag"), { x:-10, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.45, stagger:0.12, ease:"power2.out" }, start+0.9);
        }
        if (el.querySelector(".tbl-card")) {
          tl.fromTo(el.querySelector(".tbl-card"), { y:24, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.6, ease:"power3.out" }, start+0.3);
          tl.fromTo(el.querySelectorAll(".tbl thead tr"), { autoAlpha:0 }, { autoAlpha:1, duration:0.4 }, start+0.45);
          tl.fromTo(el.querySelectorAll(".tbl tbody tr"), { x:-14, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.45, ease:"power2.out", stagger:0.09 }, start+0.55);
        }
        // chart — bars grow up + value counters roll (deterministic GSAP)
        if (el.querySelector(".chart-card")) {
          tl.fromTo(el.querySelector(".chart-card"), { y:24, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.6, ease:"power3.out" }, start+0.3);
          el.querySelectorAll(".bar-item").forEach(function(item, bi){
            var target = parseFloat(item.getAttribute("data-val"))||0;
            var suffix = item.getAttribute("data-suffix")||"";
            var fill = item.querySelector(".bar-fill");
            var valEl = item.querySelector(".bar-val");
            var counter = { v: 0 };
            tl.fromTo(fill, { scaleY:0, transformOrigin:"bottom" }, { scaleY:1, duration:0.7, ease:"power3.out" }, start+0.5+bi*0.12);
            tl.to(counter, { v: target, duration:0.7, ease:"power1.out",
              onUpdate: function(){ valEl.textContent = Math.round(counter.v)+suffix; } }, start+0.5+bi*0.12);
          });
        }
        // counter — the big number rolls up to its target
        if (el.querySelector(".counter-num")) {
          var cEl = el.querySelector(".counter-num");
          var cTarget = parseFloat(cEl.getAttribute("data-val"))||0;
          var cPrefix = cEl.getAttribute("data-prefix")||"";
          var cSuffix = cEl.getAttribute("data-suffix")||"";
          var cCounter = { v: 0 };
          tl.fromTo(el.querySelector(".counter-card"), { y:24, autoAlpha:0 }, { y:0, autoAlpha:1, duration:0.6, ease:"power3.out" }, start+0.3);
          tl.fromTo(el.querySelector(".counter-eyebrow"), { x:-14, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.5, ease:"power2.out" }, start+0.4);

            bg.addColorStop(1, "rgba(10,114,239,0)");

            ctx.fillRect(bx - bl.r, by - bl.r, bl.r*2, bl.r*2);

          gg.addColorStop(0.5, "rgba(10,114,239,0.05)");
          gg.addColorStop(1, "rgba(10,114,239,0)");
          ctx.fillStyle = gg;
          ctx.fillRect(0, gy-120, W, 240);
          // particle field
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            var px = p.x + Math.sin(t*p.sp + p.ph) * 14;
            var py = p.y + Math.cos(t*p.sp*0.8 + p.ph) * 10;
            var a = 0.10 + 0.10 * (0.5 + 0.5*Math.sin(t*1.2 + p.ph));

            ctx.arc(px, py, p.r, 0, Math.PI*2);
            ctx.fillStyle = "rgba(10,114,239,"+a.toFixed(3)+")";
            ctx.fill();
          }

        tl.eventCallback("onUpdate", function(){ draw(tl.time()); });

      .slide .bar-fill { width:100%; height:100%; background:linear-gradient(180deg, var(--accent), var(--accent-text)); border-radius:2px; transform:scaleY(0); transform-origin:bottom; }
      .slide .bar-val { font-family:"JetBrains Mono",monospace; font-size:30px; font-weight:700; color:var(--accent-text); letter-spacing:-.01em; }
      .slide .bar-label { font-size:20px; font-weight:600; color:var(--ink-200); text-align:center; line-height:1.3; }
      /* counter — big animated metric */
      .slide .counter-card { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
      .slide .counter-eyebrow { font-family:"JetBrains Mono",monospace; font-size:20px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent-text); }
      .slide .counter-num { font-family:"JetBrains Mono",monospace; font-size:150px; font-weight:700; line-height:1; color:var(--accent-text); letter-spacing:-.03em; }
      .slide .counter-delta { font-family:"JetBrains Mono",monospace; font-size:30px; font-weight:700; color:var(--ink); background:var(--accent-soft); border:1px solid var(--accent-hair); border-radius:2px; padding:8px 18px; }
      .slide .counter-label { font-size:34px; font-weight:700; color:var(--ink); }
      .slide .counter-note { font-size:22px; color:var(--ink-300); max-width:1100px; line-height:1.5; }
      /* cards — 3D spread (stacked cards fan out) */
      .slide .spread { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; gap:34px; perspective:1200px; }
      .slide .spread-card { width:340px; min-height:360px; background:var(--surface); box-shadow:var(--shadow-elev); border-radius:2px; padding:34px 30px; display:flex; flex-direction:column; gap:16px; border-top:3px solid var(--accent); }
      .slide .spread-card .sc-no { font-family:"JetBrains Mono",monospace; font-size:40px; font-weight:700; color:var(--accent-text); line-height:1; }
      .slide .spread-card .sc-title { font-size:28px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
      .slide .spread-card .sc-body { font-size:20px; color:var(--ink-200); line-height:1.5; }
      /* steps — process flow with connecting line + pulsing nodes */
      .slide .steps { flex:1; min-height:0; display:flex; align-items:center; justify-content:space-between; gap:20px; position:relative; }
      .slide .steps::before { content:""; position:absolute; left:8%; right:8%; top:44px; height:2px; background:var(--line-strong); }
      .slide .step { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; position:relative; z-index:1; }
      .slide .step-node { width:88px; height:88px; border-radius:50%; background:var(--surface); border:3px solid var(--accent); box-shadow:var(--shadow-rest); display:flex; align-items:center; justify-content:center; }
      .slide .step-node span { font-family:"JetBrains Mono",monospace; font-size:34px; font-weight:700; color:var(--accent-text); }
      .slide .step-title { font-size:26px; font-weight:700; color:var(--ink); }
      .slide .step-body { font-size:19px; color:var(--ink-200); line-height:1.45; max-width:300px; }
      /* cute flat illustration chip (brand blue line art, accent-soft chip) */
      .slide .illust { position:absolute; top:11%; right:7%; width:150px; height:150px; z-index:5;
        display:flex; align-items:center; justify-content:center;
        background:var(--accent-soft); border:1px solid var(--accent-hair);
        border-radius:16px; box-shadow:var(--shadow-rest); }
      .slide .illust svg { width:104px; height:104px; }
      /* analysis chip — the "so what" layer, distinct from the fact bullets */
      .slide .analysis { margin-top:18px; max-width:1240px; display:flex; align-items:flex-start; gap:16px;
        background:var(--accent-soft); border-left:3px solid var(--accent);
        padding:14px 20px; border-radius:2px; }
      .slide .analysis .an-tag { flex:0 0 auto; font-family:"JetBrains Mono",monospace; font-size:15px;
        letter-spacing:.12em; text-transform:uppercase; color:#0a5fc4; padding-top:5px; }
      .slide .analysis .an-txt { font-size:21px; font-weight:500; line-height:1.42; color:var(--ink); }
      /* callback tags — the "links to earlier chapters" connective tissue */
      .slide .callbacks { margin-top:16px; display:flex; flex-wrap:wrap; gap:10px; max-width:1240px; }
      .slide .cb-tag { display:inline-flex; align-items:center; gap:8px;
        font-family:"JetBrains Mono",monospace; font-size:16px; letter-spacing:.03em;
        color:var(--ink-300); border:1px solid var(--line); border-radius:2px; padding:7px 12px;
        background:var(--surface); }
      .slide .cb-tag .cb-arrow { color:var(--accent-text); font-weight:700; }

      /* ── Content-aware visualizer cards (Layer 2) ── */
      .viz-card { background:var(--surface); box-shadow:var(--shadow-elev); border-radius:2px;
        border-top:3px solid var(--accent); overflow:hidden; }
      .viz-head { display:flex; align-items:baseline; gap:14px; padding:20px 26px 0;
        border-bottom:1px solid var(--line); padding-bottom:16px; }
      .viz-head .viz-tag { font-family:"JetBrains Mono",monospace; font-size:15px; letter-spacing:.14em;
        text-transform:uppercase; color:var(--accent-text); border:1px solid var(--accent-hair);
        padding:3px 9px; border-radius:2px; }
      .viz-head .viz-title { font-size:26px; font-weight:700; color:var(--ink); letter-spacing:-.01em; }
      .viz-head .viz-unit { margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:16px;
        color:var(--ink-300); letter-spacing:.04em; }
      /* standalone visualizer slides fill the wrap */
      .slide .viz-standalone { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
      .slide .viz-standalone .viz-card { width:100%; max-width:1500px; height:100%; }

      /* metric_chart */
      .mc-card { padding-bottom:20px; }
      .mc-svg { width:100%; height:auto; display:block; padding:10px 20px 0; }
      .mc-line { stroke-dasharray: 2000; stroke-dashoffset: 2000; }
      .mc-area { opacity:0; }
      .mc-dot { transform-box: fill-box; transform-origin: center; }
      .mc-halo { transform-box: fill-box; transform-origin: center; }
      .mc-xlabel { font-family:"JetBrains Mono",monospace; font-size:15px; fill:var(--ink-300); }
      .mc-vlabel { font-family:"JetBrains Mono",monospace; font-size:17px; font-weight:700; fill:var(--accent-text); }

      /* pipeline */
      .pipe-card { padding:30px 26px; }
      .pipe { display:flex; align-items:center; justify-content:center; gap:0; }
      .pipe-node { display:flex; flex-direction:column; align-items:center; gap:14px; min-width:150px; }
      .pipe-node .pn-ring { width:96px; height:96px; border-radius:50%; background:var(--surface);
        border:3px solid var(--accent); box-shadow:var(--shadow-rest);
        display:flex; align-items:center; justify-content:center; }
      .pipe-node .pn-idx { font-family:"JetBrains Mono",monospace; font-size:34px; font-weight:700; color:var(--accent-text); }
      .pipe-node .pn-label { font-size:24px; font-weight:700; color:var(--ink); text-align:center; }
      .pipe-link { position:relative; flex:1; min-width:60px; height:2px; background:var(--line-strong); margin:0 8px; }
      .pipe-link .pl-packet { position:absolute; top:50%; left:0; width:12px; height:12px; margin-top:-6px;
        border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
      .pipe-link .pl-label { position:absolute; top:-26px; left:50%; transform:translateX(-50%);
        font-family:"JetBrains Mono",monospace; font-size:14px; color:var(--ink-400); white-space:nowrap; }

      /* benchmark */
      .bm-card { padding:30px 34px; }
      .bm-list { display:flex; flex-direction:column; gap:22px; padding-top:10px; }
      .bm-item { display:grid; grid-template-columns: 200px 1fr 120px; align-items:center; gap:18px; }
      .bm-label { font-size:22px; font-weight:600; color:var(--ink-200); text-align:right; }
      .bm-track { height:34px; background:rgba(23,23,23,0.04); border-radius:2px; overflow:hidden; }
      .bm-fill { height:100%; width:100%; background:linear-gradient(90deg, var(--accent), var(--accent-text));
        transform:scaleX(0); transform-origin:left; }
      .bm-val { font-family:"JetBrains Mono",monospace; font-size:28px; font-weight:700; color:var(--accent-text); }

      /* security */
      .sec-card { padding:24px 30px; }
      .sec-body { display:flex; align-items:center; gap:34px; padding-top:10px; }
      .sec-gauge { position:relative; width:300px; flex:0 0 auto; }
      .sec-svg { width:100%; height:auto; display:block; }
      .sec-arc { stroke-dasharray: 251; stroke-dashoffset: 251; }
      .sec-needle { transform-box: fill-box; }
      .sec-score { position:absolute; left:0; right:0; bottom:6px; text-align:center; }
      .sec-num { font-family:"JetBrains Mono",monospace; font-size:52px; font-weight:700; color:var(--accent-text); line-height:1; }
      .sec-sev { display:block; font-family:"JetBrains Mono",monospace; font-size:16px; letter-spacing:.14em;
        color:var(--ink-400); margin-top:4px; }
      .sec-side { flex:1; display:flex; flex-direction:column; gap:18px; }
      .sec-pulse { display:flex; align-items:center; gap:12px; }
      .sec-pulse-dot { width:14px; height:14px; border-radius:50%; background:var(--accent); }
      .sec-pulse-txt { font-size:22px; font-weight:600; color:var(--ink); }
      .sec-ports-label { font-family:"JetBrains Mono",monospace; font-size:14px; letter-spacing:.12em;
        color:var(--ink-400); text-transform:uppercase; }
      .sec-ports-list { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
      .sec-port { font-family:"JetBrains Mono",monospace; font-size:18px; font-weight:700; color:var(--accent-text);
        border:1px solid var(--accent-hair); background:var(--accent-soft); border-radius:2px; padding:6px 12px; }
      .sec-note { font-size:19px; color:var(--ink-300); line-height:1.5; }

      /* terminal */
      .term-card { background:#0a0a0c; border-top:3px solid var(--accent); }
      .term-bar { display:flex; align-items:center; gap:8px; padding:14px 20px; background:rgba(255,255,255,0.04); }
      .term-dot { width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,0.18); }
      .term-title { margin-left:10px; font-family:"JetBrains Mono",monospace; font-size:16px; color:rgba(255,255,255,0.6); }
      .term-body { padding:24px 28px; font-family:"JetBrains Mono",monospace; font-size:24px; line-height:1.7; }
      .term-line { color:rgba(255,255,255,0.85); white-space:pre-wrap; }
      .term-line.term-cmd { color:#7cc0ff; }
      .term-line.term-out { color:rgba(255,255,255,0.55); }
      .term-caret { display:inline-block; width:12px; height:26px; margin-left:4px; vertical-align:middle;
        background:var(--accent); }

      /* speaker-tinted captions: male = brand accent, female = ink grey */
      .cap { border-left-color: var(--accent); }
      .cap.sp-f { border-left-color: var(--ink-300); }
    </style>
  </body>
</html>
