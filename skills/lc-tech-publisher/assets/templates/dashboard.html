<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      :root {
        --canvas: #fafbfc; --surface: #ffffff; --ink: #171718;
        --ink-200: #4e5159; --ink-300: #565a63; --ink-400: #6b6e75;
        --line: #e0e2e8; --line-strong: #b4b8c2;
        --accent: #0a72ef; --accent-text: #0a63d0; --accent-soft: rgba(10,114,239,0.10); --accent-hair: rgba(10,114,239,0.40);
        --shadow-rest: rgba(23,23,23,0.06) 0 0 0 1px, rgba(23,23,23,0.04) 0 1px 2px, #ffffff 0 0 0 1px inset;
        --shadow-elev: rgba(23,23,23,0.10) 0 0 0 1px, rgba(23,23,23,0.10) 0 4px 12px, rgba(23,23,23,0.06) 0 12px 28px;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; background: var(--canvas); overflow: hidden;
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      [data-composition-id] { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

      #bg-grid { position: absolute; inset: 0; z-index: 0; }
      .scanline { position: absolute; left: 0; right: 0; height: 1px; z-index: 2; pointer-events: none;
        background: linear-gradient(90deg, transparent, var(--accent-hair), transparent); opacity: 0; }

      /* playful background decorations — tiny brand-blue glyphs at the frame
         edges, below the slides so they never fight the content */
      #bg-deco { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
      #bg-deco .deco { position: absolute; will-change: transform; }
      #bg-deco .deco svg { width: 100%; height: 100%; display: block; }

      /* L0 atmosphere canvas — sits above the grid/deco, below the slides */
      #atmo { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

      /* mascot — cute robot, bottom-right. z-index 4 keeps it in the background
         layer (under the slides) so it never covers content; the slides have a
         transparent background, so it stays visible as a quiet companion. */
      #mascot { position: absolute; right: 3.5%; bottom: 4%; width: 120px; height: 120px; z-index: 4;
        pointer-events: none; filter: drop-shadow(0 6px 12px rgba(23,23,23,0.08)); }
      #mascot svg { width: 100%; height: 100%; display: block; }
      #mascot .mascot-eyes { transform-box: fill-box; transform-origin: center; }

      #stage { position: absolute; inset: 0; z-index: 5; }

      /* embedded single-line caption (bottom) — one line at a time */
      .cap { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
        max-width: 1500px; width: max-content; z-index: 30;
        padding: 12px 28px; background: rgba(255,255,255,0.95);
        border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 2px;
        box-shadow: var(--shadow-rest);
        font-size: 28px; font-weight: 600; line-height: 1; color: var(--ink);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
        display: block; opacity: 0; visibility: hidden;
      }

    </style>
  </head>
  <body>
    <div
      id="master"
      data-composition-id="master"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="{{DURATION}}"
    >
      <svg id="bg-grid" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" viewBox="0 0 1920 1080">
        <defs>
          <pattern id="grid-pat" width="64" height="64" patternUnits="userSpaceOnUse">
            <path d="M64 0 H0 V64" fill="none" stroke="rgba(23,23,23,0.04)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="1920" height="1080" fill="url(#grid-pat)"/>
      </svg>
      <div class="scanline" id="scanline"></div>

      <!-- playful background decorations (fixed hand-built set, animated by GSAP) -->
      <div id="bg-deco"></div>

      <!-- L0 atmosphere: deterministic Canvas 2D layer (dither particles + grid
           pulse). Redrawn on every GSAP timeline seek via onUpdate — no
           Date.now()/requestAnimationFrame, so Hyperframes can seek any frame. -->
      <canvas id="atmo" width="1920" height="1080"></canvas>

      <!-- mascot: a cute little robot that floats, blinks and waves through the show -->
      <div id="mascot" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="8" aria-hidden="true">
        <svg id="mascot-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
          <line x1="80" y1="44" x2="80" y2="26" stroke="#0a72ef" stroke-width="4" stroke-linecap="round"/>
          <circle cx="80" cy="19" r="8" fill="#0a72ef"/>
          <circle cx="80" cy="90" r="52" fill="rgba(10,114,239,0.10)" stroke="#0a72ef" stroke-width="4"/>
          <g class="mascot-eyes">
            <circle cx="63" cy="82" r="12" fill="#ffffff" stroke="#0a72ef" stroke-width="3"/>
            <circle cx="66" cy="84" r="5.5" fill="#0a63d0"/>
            <circle cx="97" cy="82" r="12" fill="#ffffff" stroke="#0a72ef" stroke-width="3"/>
            <circle cx="94" cy="84" r="5.5" fill="#0a63d0"/>
          </g>
          <path d="M72 108 Q80 116 88 108" fill="none" stroke="#0a63d0" stroke-width="4" stroke-linecap="round"/>
          <circle cx="50" cy="99" r="6" fill="rgba(10,114,239,0.16)"/>
          <circle cx="110" cy="99" r="6" fill="rgba(10,114,239,0.16)"/>
          <circle cx="66" cy="142" r="7" fill="#0a72ef"/>
          <circle cx="94" cy="142" r="7" fill="#0a72ef"/>
        </svg>
      </div>

      <div id="stage" data-layout-allow-overlap><!-- slides injected by build_composition.py --></div>

      <div id="captions"></div>
      <div id="audio-clips"></div>
    </div>

    <script>window.LC_DATA = {}; /* replaced by build_composition.py */</script>
    <script>
      window.__timelines = window.__timelines || {};
      var DATA = window.LC_DATA || {};
      var ACC = "#0a72ef";
      var LOCKUP = '<div class="lockup"><img src="'+esc(DATA.logo||"logos/lc.svg")+'" alt=""><span>LongCipher</span></div>';
      function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function mono(s){ return '<span style="font-family:\'JetBrains Mono\',monospace">'+esc(s)+"</span>"; }
      /* Kinetic typography: `**keyword**` in any copy becomes a highlighted
         accent span (L3). The LLM marks the word that carries the semantic
         weight; the template owns the styling. */
      function hl(s){
        return String(s==null?"":s).replace(/\*\*([^*]+)\*\*/g, '<span class="kt-hl">$1</span>');
      }
      function escHl(s){ return hl(esc(s)); }

      /* Cute flat illustration catalog — injected by build_composition.py from
         assets/templates/_icons.js (single source of truth). The LLM picks a
         key via the `icon` field; unknown keys fall back to "spark". */
{{ICONS_JS}}
      function iconSVG(name){
        return ICONS[name] || ICONS.spark;
      }

      /* ── Build slides ── */
      var slides = DATA.slides || [];
      var html = "";

      // Slide 0 = cover (hero), always present.
      var c = DATA.cover || {};
      var headlines = (c.headlines||[]).map(function(h){
        return '<li><span class="hl-idx">›</span><span class="hl-txt">'+esc(h)+'</span></li>';
      }).join("");
      html += ''
        + '<section class="slide" id="slide-0" data-s="0">'
        +   LOCKUP
        +   '<div class="corner-tag">'+esc(c.cornerTag||c.kicker||"BRIEF")+'</div>'
        +   '<div class="center">'
        +     '<div class="kicker">'+esc(c.kicker||"")+'</div>'
        +     '<div class="title">'+esc(c.title||"").replace(/\\n/g,"<br>")+'</div>'
        +     '<div class="sub">'+esc(c.subtitle||"").replace(/\\n/g,"<br>")+'</div>'
        +     (headlines ? '<div class="headlines"><div class="hl-head">'+esc(c.headlinesLabel||meta.headlinesLabel||"TODAY’S FOCUS")+'</div><ul>'+headlines+'</ul></div>' : '')
        +   '</div>'
        +   '<div class="meta-row"><span class="left">'+esc(c.metaLeft||"")+'</span><span class="center-bar"></span><span class="right">'+esc(c.metaRight||"")+'</span></div>'
        + '</section>';

      // Slides 1..n from data.
      slides.forEach(function(s, i){
        var n = i + 1;
        var sStart = s._start != null ? s._start : 0;
        var sEnd   = s._end   != null ? s._end   : sStart + 8;
        var sAttrs = ' data-start="'+sStart+'" data-end="'+sEnd+'"';
        if (s.type === "keypoint") {
          var bullets = (s.bullets||[]).map(function(b){
            return '<li><span class="b-dot"></span><span class="b-txt">'+escHl(b)+'</span></li>';
          }).join("");
          var callbacks = (s.callback||[]).map(function(cb){
            return '<span class="cb-tag"><span class="cb-arrow">↳</span><span class="cb-txt">'+esc(cb)+'</span></span>';
          }).join("");
          html += ''
            + '<section class="slide'+(s.icon?' has-illust':'')+'" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   LOCKUP
            +   '<div class="accent-rule"></div>'
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="stage">'
            +     '<div class="eyebrow">'+esc(s.eyebrow||"核心观点")+'</div>'
            +     '<div class="statement">'+escHl(s.statement||"")+'</div>'
            +     (s.support ? '<div class="support">'+escHl(s.support)+'</div>' : '')
            +     (bullets ? '<ul class="bullets">'+bullets+'</ul>' : '')
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+escHl(s.analysis)+'</span></div>' : '')
            +     (callbacks ? '<div class="callbacks">'+callbacks+'</div>' : '')
            +   '</div>'
            +   '<div class="idx-tag">'+String(n).padStart(2,"0")+' / '+String(slides.length).padStart(2,"0")+'</div>'
            + '</section>';
        } else if (s.type === "three_points") {
          var pts = (s.points||[]).map(function(p){
            return '<div class="point">'
              + '<div class="no">'+esc(p.no||"")+'</div>'
              + '<div class="pt-title">'+esc(p.title||"")+'</div>'
              + '<div class="bar"></div>'
              + '<div class="pt-body">'+esc(p.body||"")+'</div>'
              + '</div>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   LOCKUP
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">SUMMARY</span><h2>'+esc(s.title||"三点总结")+'</h2></div>'
            +     '<div class="grid">'+pts+'</div>'
            +   '</div>'
            + '</section>';
        } else if (s.type === "outro") {
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   LOCKUP
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="card">'
            +     '<div class="kicker">WRAP-UP</div>'
            +     '<div class="recap">'+esc(s.recap||"")+'</div>'
            +     '<div class="divider"></div>'
            +     '<div class="signoff">'+esc(s.signoff||"LongCipher")+'</div>'
            +   '</div>'
            + '</section>';
        } else if (s.type === "table") {
          var numCols = (s.numCols||[]);
          var headCells = (s.head||[]).map(function(h){ return '<th>'+esc(h)+'</th>'; }).join("");
          var bodyRows = (s.rows||[]).map(function(r){
            var cells = (r||[]).map(function(c, ci){
              return '<td'+(numCols.indexOf(ci)>=0?' class="num"':'')+'>'+esc(c)+'</td>';
            }).join("");
            return '<tr>'+cells+'</tr>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   LOCKUP
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">DATA</span><h2>'+esc(s.title||"数据一览")+'</h2></div>'
            +     '<div class="tbl-card">'
            +       '<table class="tbl"><thead><tr>'+headCells+'</tr></thead><tbody>'+bodyRows+'</tbody></table>'
            +     '</div>'
            +   '</div>'
            + '</section>';
        } else if (s.type === "chart") {
          // Dither-style bar chart — bars grow up + value counters roll, all
          // driven by the GSAP timeline (deterministic, no Date.now()).
          var chartBars = (s.bars||[]).map(function(b){
            return { label: b.label||"", value: parseFloat(b.value)||0, suffix: b.suffix||"" };
          });
          var chartMax = s.max || 0;
          chartBars.forEach(function(b){ if (b.value > chartMax) chartMax = b.value; });
          if (chartMax <= 0) chartMax = 1;
          var chartHtml = chartBars.map(function(b, bi){
            var pct = Math.round((b.value / chartMax) * 100);
            return '<div class="bar-item" data-bar="'+bi+'" data-val="'+b.value+'" data-suffix="'+esc(b.suffix)+'" data-pct="'+pct+'">'
              + '<div class="bar-track"><div class="bar-fill"></div></div>'
              + '<div class="bar-val">0</div>'
              + '<div class="bar-label">'+esc(b.label)+'</div>'
              + '</div>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   LOCKUP
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">CHART</span><h2>'+esc(s.title||"数据对比")+'</h2></div>'
            +     '<div class="chart-card">'
            +       '<div class="chart-bars">'+chartHtml+'</div>'
            +     '</div>'
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+esc(s.analysis)+'</span></div>' : '')
            +   '</div>'
            + '</section>';
        } else if (s.type === "counter") {
          // Big animated metric counter — the number rolls up to its target.
          var cVal = parseFloat(s.value)||0;
          var cSuffix = s.suffix||"";
          var cPrefix = s.prefix||"";
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   LOCKUP
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">METRIC</span><h2>'+esc(s.title||"关键指标")+'</h2></div>'
            +     '<div class="counter-card">'
            +       '<div class="counter-eyebrow">'+esc(s.eyebrow||"")+'</div>'
            +       '<div class="counter-num" data-val="'+cVal+'" data-prefix="'+esc(cPrefix)+'" data-suffix="'+esc(cSuffix)+'">'+esc(cPrefix)+'0'+esc(cSuffix)+'</div>'
            +       (s.delta ? '<div class="counter-delta">'+esc(s.delta)+'</div>' : '')
            +       '<div class="counter-label">'+esc(s.label||"")+'</div>'
            +       (s.note ? '<div class="counter-note">'+esc(s.note)+'</div>' : '')
            +     '</div>'
            +     (s.analysis ? '<div class="analysis"><span class="an-tag">'+(DATA.lang==="en"?"SO-WHAT":"分析")+'</span><span class="an-txt">'+esc(s.analysis)+'</span></div>' : '')
            +   '</div>'
            + '</section>';
        } else if (s.type === "cards") {
          // 3D card spread — stacked cards fan out to reveal feature/matrix items.
          var cardItems = (s.cards||[]).map(function(cd, ci){
            return '<div class="spread-card" data-card="'+ci+'">'
              + '<div class="sc-no">'+esc(cd.no||String(ci+1).padStart(2,"0"))+'</div>'
              + '<div class="sc-title">'+esc(cd.title||"")+'</div>'
              + '<div class="sc-body">'+esc(cd.body||"")+'</div>'
              + '</div>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   LOCKUP
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">MATRIX</span><h2>'+esc(s.title||"能力矩阵")+'</h2></div>'
            +     '<div class="spread">'+cardItems+'</div>'
            +   '</div>'
            + '</section>';
        } else if (s.type === "steps") {
          // Process / flow — nodes connected by a line that draws in, each node pulses.
          var stepItems = (s.steps||[]).map(function(st, si){
            return '<div class="step" data-step="'+si+'">'
              + '<div class="step-node"><span>'+esc(st.no||String(si+1))+'</span></div>'
              + '<div class="step-title">'+esc(st.title||"")+'</div>'
              + '<div class="step-body">'+esc(st.body||"")+'</div>'
              + '</div>';
          }).join("");
          html += ''
            + '<section class="slide" id="slide-'+n+'" data-s="'+n+'"'+sAttrs+'>'
            +   LOCKUP
            +   (s.icon ? '<div class="illust" data-illust="'+esc(s.icon)+'">'+iconSVG(s.icon)+'</div>' : '')
            +   '<div class="wrap">'
            +     '<div class="head"><span class="tag">FLOW</span><h2>'+esc(s.title||"流程拆解")+'</h2></div>'
            +     '<div class="steps">'+stepItems+'</div>'
            +   '</div>'
            + '</section>';
        }
      });
      document.getElementById("stage").innerHTML = html;

      /* ── Captions (one line per cue, refreshed in step with audio) ── */
      var caps = "";
      var cueIdx = 0;
      (DATA.turns||[]).forEach(function(t){
        var cues = t.cues && t.cues.length ? t.cues : [{ text: t.text, speaker: t.speaker, start: t.start, end: t.end }];
        cues.forEach(function(c){
          var sp = c.speaker === "female" ? " sp-f" : "";
          caps += '<div class="cap clip'+sp+'" data-cap="'+cueIdx+'" data-start="'+c.start+'" data-duration="'+((c.end-c.start)).toFixed(3)+'" data-track-index="100">'+esc(c.text)+'</div>';
          cueIdx++;
        });
      });
      document.getElementById("captions").innerHTML = caps;

      /* ── Audio ── */
      var aud = "";
      (DATA.turns||[]).forEach(function(t,i){
        aud += '<audio class="clip" src="'+t.file+'" data-start="'+t.start+'" data-duration="'+t.duration+'" data-track-index="'+(200+i)+'" data-volume="1"></audio>';
      });
      document.getElementById("audio-clips").innerHTML = aud;

      /* ── GSAP timeline ── */
      var tl = gsap.timeline({ paused: true });
      tl.set(".cap", { autoAlpha: 0 }, 0);

      /* ── Playful background decorations ──
         A fixed, hand-built set of tiny brand-blue glyphs (star, dot, cross,
         ring, square) scattered at the frame edges so they never collide with
         the center content. Each glyph bobs up/down and gently rotates on its
         own phase. Repeat counts are FINITE (derived from the composition
         duration) — the checker rejects repeat:-1 on a finite composition. */
      (function buildDeco(){
        var box = document.getElementById("bg-deco");
        var DUR = parseFloat("{{DURATION}}");
        var glyphs = [
          // type, x%, y%, size, spin(deg), bobAmt
          ["spark", 4, 12, 26, 0, 10], ["spark", 91, 8, 18, 120, 8],
          ["spark", 95, 86, 22, 240, 9], ["spark", 3, 82, 20, 60, 7],
          ["dot", 8, 24, 10, 40, 12], ["dot", 88, 30, 12, 200, 10],
          ["dot", 12, 74, 8, 160, 8], ["dot", 90, 66, 9, 300, 9],
          ["cross", 7, 40, 22, 90, 6], ["cross", 93, 48, 24, 210, 7],
          ["cross", 10, 60, 18, 330, 5], ["cross", 87, 18, 20, 150, 6],
          ["ring", 5, 54, 24, 260, 8], ["ring", 94, 40, 20, 30, 9],
          ["ring", 12, 30, 16, 110, 7], ["ring", 90, 78, 26, 280, 6],
          ["square", 6, 66, 14, 70, 10], ["square", 92, 58, 12, 340, 8],
          ["square", 9, 16, 12, 230, 7], ["square", 88, 90, 16, 20, 9],
        ];
        var T = {
          spark: '<svg viewBox="0 0 64 64"><path d="M32 6 c2.5 14 7 18.5 18 20 c-11 1.5 -15.5 6 -18 20 c-2.5 -14 -7 -18.5 -18 -20 c11 -1.5 15.5 -6 18 -20 Z" fill="rgba(10,114,239,0.14)"/></svg>',
          dot: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="rgba(10,114,239,0.16)"/></svg>',
          cross: '<svg viewBox="0 0 64 64"><path d="M32 12 v40 M12 32 h40" stroke="rgba(10,114,239,0.28)" stroke-width="9" stroke-linecap="round"/></svg>',
          ring: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="16" fill="none" stroke="rgba(10,114,239,0.30)" stroke-width="6"/></svg>',
          square: '<svg viewBox="0 0 64 64"><rect x="14" y="14" width="36" height="36" rx="8" fill="rgba(10,114,239,0.14)"/></svg>',
        };
        glyphs.forEach(function(g, i){
          var el = document.createElement("div");
          el.className = "deco";
          el.style.cssText = "left:"+g[1]+"%;top:"+g[2]+"%;width:"+g[3]+"px;height:"+g[3]+"px;";
          el.innerHTML = T[g[0]];
          box.appendChild(el);
          // every glyph has a unique slow bob + spin over the whole run
          var bobDur = 3.4 + (i % 5) * 0.55;
          var spins = Math.max(2, Math.round((DUR / bobDur)));
          tl.to(el, { y: g[5], rotation: g[4], duration: bobDur, ease:"sine.inOut", yoyo:true, repeat:spins, delay:(i % 3) * 0.35 }, 0);
        });
      })();

      /* ── Mascot ──
         The cute robot floats gently the whole show and blinks on a fixed
         cadence. Finite repeats only (derived from the composition duration). */
